version: "2"

run:
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gosec
    - govet
    - ineffassign
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - reassign
    - recvcheck
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
      verbose: true
    govet:
      enable-all: true
      # These are broad layout/style policies rather than curated correctness gates.
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -SA9003
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
