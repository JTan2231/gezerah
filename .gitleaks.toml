title = "Gezerah Gitleaks configuration"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Allow the explicit synthetic password used by authentication tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/specs/support/auth\.ts$''']
regexTarget = "line"
regexes = ['''TEST_PASSWORD = "correct-horse-battery-staple-42";''']
